<!DOCTYPE html>
<html>
<head>
    <title>Photo Library</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Header */
        header {
            height: 60px;
            background-color: #35031d;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;
        }

        header h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        /* Layout */
        .container {
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            min-height: calc(100vh - 60px);

            background-color: #35031deb;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;

            padding: 15px 5px;
        }

        .sidebar a:hover {
            background-color: #374151;
        }

        /* Main content */
        main {
            flex: 1;
            padding: 30px;
        }

        /* Photo cards */
        .gallery {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;
        }

        .card {
            background-color: white;

            border-radius: 8px;
            overflow: hidden;

            box-shadow: 0 2px 8px #ccc;
        }

        .card img {
            width: 100%;
            height: 180px;

            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .card h3 {
            margin: 0 0 10px;
        }

        .card p {
            color: #555;
        }

        /* Responsive */
        @media (max-width: 700px) {

            .sidebar {
                display: none;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>

<body>

    <!-- Header -->
    <header>

        <h2>Photo Library</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">Photos</a>
            <a href="#">About</a>
        </nav>

    </header>


    <!-- Sidebar + Main -->
    <div class="container">

        <!-- Sidebar -->
        <aside class="sidebar">

            <a href="#">All Photos</a>
            <a href="#">Nature</a>
            <a href="#">Travel</a>
            <a href="#">People</a>
            <a href="#">Favorites</a>

        </aside>


        <!-- Main Content -->
        <main>

            <h1>My Photo Library</h1>

            <div class="gallery">

                <!-- Card 1 -->
                <div class="card">

                    <img src="https://picsum.photos/400/250?random=1">

                    <div class="card-content">
                        <h3>Mountain</h3>
                        <p>Beautiful mountain view.</p>
                    </div>

                </div>


                <!-- Card 2 -->
                <div class="card">

                    <img src="https://picsum.photos/400/250?random=2">

                    <div class="card-content">
                        <h3>Nature</h3>
                        <p>A peaceful nature scene.</p>
                    </div>

                </div>


                <!-- Card 3 -->
                <div class="card">

                    <img src="https://picsum.photos/400/250?random=3">

                    <div class="card-content">
                        <h3>City</h3>
                        <p>A beautiful city view.</p>
                    </div>

                </div>


                <!-- Card 4 -->
                <div class="card">

                    <img src="https://picsum.photos/400/250?random=4">

                    <div class="card-content">
                        <h3>Beach</h3>
                        <p>A relaxing beach view.</p>
                    </div>

                </div>


                <!-- Card 5 -->
                <div class="card">

                    <img src="https://picsum.photos/400/250?random=5">

                    <div class="card-content">
                        <h3>Forest</h3>
                        <p>A beautiful forest.</p>
                    </div>

                </div>


                <!-- Card 6 -->
                <div class="card">

                    <img src="https://picsum.photos/400/250?random=6">

                    <div class="card-content">
                        <h3>Travel</h3>
                        <p>A memorable travel photo.</p>
                    </div>

                </div>

            </div>

        </main>

    </div>

</body>
</html>
